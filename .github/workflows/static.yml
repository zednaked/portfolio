# Every push and pull request is checked: lint, formatting, types, unit tests,
# and end-to-end tests (keyboard, axe, language switch) against the production
# build. master deploys to GitHub Pages only when all of it passes.
name: Check and deploy

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push doesn't cancel one in progress.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Lint, formatting, types, unit tests
        run: npm run check
      # Chromium before the build: the build prerenders the first screen with it.
      - run: npx playwright install --with-deps chromium
      - name: Build (prerendered first screen, JS budget)
        run: npm run build
      - name: End-to-end tests (Chromium; desktop, phone, reduced motion)
        run: npm run test:e2e
      # The build is measured before it can deploy: phone profile, median of
      # three, served with gzip like Pages, against the README's limits.
      - name: Lighthouse gate (phone, median of 3)
        run: |
          node scripts/serve.mjs 4180 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4180/portfolio/ >/dev/null; do sleep 0.2; done'
          CHROME_PATH=$(which google-chrome) node scripts/lighthouse.mjs http://127.0.0.1:4180/portfolio/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/master'
        with:
          path: app/dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
